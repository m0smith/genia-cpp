name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genia-cpp-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-test-conformance:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    name: Build, test, and conformance
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out genia-cpp
        uses: actions/checkout@v6
        with:
          path: genia-cpp

      - name: Check out pinned genia-2026 contract
        uses: actions/checkout@v6
        with:
          repository: m0smith/genia-2026
          ref: 6402e668ae85a1e7efe94b3ac3d51f233b730ca4
          path: genia-2026

      - name: Set up Python 3.14
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install analysis tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes clang-format clang-tidy

      - name: Verify required toolchain
        shell: bash
        run: |
          set -euo pipefail
          cmake --version
          c++ --version
          python --version
          clang-format --version
          clang-tidy --version

      - name: Configure release build
        working-directory: genia-cpp
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Build
        working-directory: genia-cpp
        run: cmake --build build

      - name: Run C++ tests
        working-directory: genia-cpp
        run: ctest --test-dir build --output-on-failure

      - name: Check formatting
        working-directory: genia-cpp
        run: clang-format --dry-run --Werror src/*.cpp src/*.hpp tests/*.cpp

      - name: Run static analysis
        working-directory: genia-cpp
        shell: bash
        run: |
          report="$RUNNER_TEMP/clang-tidy.log"
          status=0
          clang-tidy -p build src/main.cpp src/adapter.hpp src/protocol.hpp > "$report" 2>&1 || status=$?
          python - "$report" <<'PY'
          import collections
          import os
          import pathlib
          import re
          import sys

          report = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          checks = collections.Counter(re.findall(r"warning:.*\[([^\]]+)\]", report))
          total = sum(checks.values())
          print(f"clang-tidy: {total} project warning diagnostics; full output in the clang-tidy-report artifact.")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary:
              summary.write(f"### Static analysis\n\n{total} project warning diagnostics. "
                            "Full output is available in the **clang-tidy-report** artifact.\n\n")
              summary.write("| Check | Diagnostics |\n| --- | ---: |\n")
              for check, count in checks.most_common():
                  summary.write(f"| `{check}` | {count} |\n")
          PY
          if [ "$status" -ne 0 ]; then
            cat "$report"
            exit "$status"
          fi

      - name: Upload static analysis report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: clang-tidy-report
          path: ${{ runner.temp }}/clang-tidy.log
          if-no-files-found: ignore

      - name: Bootstrap uv
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check --no-input uv
          echo "UV_PYTHON=$(command -v python)" >> "$GITHUB_ENV"
          echo "UV_PYTHON_DOWNLOADS=never" >> "$GITHUB_ENV"

      - name: Sync conformance dependencies
        working-directory: genia-2026
        run: python -m uv sync --dev --python "$UV_PYTHON"

      - name: Run pinned shared conformance
        working-directory: genia-2026
        run: >-
          python -m uv run --python "$UV_PYTHON" python -m tools.spec_runner
          --host "$GITHUB_WORKSPACE/genia-cpp/build/genia-adapter"
          --evidence "$RUNNER_TEMP/genia-cpp-evidence.json"

      - name: Verify conformance failure invariants
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/genia-cpp-evidence.json" <<'PY'
          import json
          import pathlib
          import sys

          evidence = json.loads(pathlib.Path(sys.argv[1]).read_text(encoding="utf-8"))
          failing = ("fail", "protocol_error", "crash", "timeout", "invalid")
          nonzero = {name: evidence["counts"][name] for name in failing if evidence["counts"][name]}
          if nonzero:
              raise SystemExit(f"conformance failure counts are nonzero: {nonzero}")
          print(json.dumps(evidence["counts"], sort_keys=True))
          PY
